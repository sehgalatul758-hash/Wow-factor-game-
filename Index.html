<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra & Number Theory Lab</title>
    <style>
        :root {
            --bg-dark: #070b14;
            --panel-bg: #11192c;
            --card-bg: #1a2540;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #18233c 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 1.9rem;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-emerald));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-bar {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);
            padding: 10px 22px;
            border-radius: 50px;
            border: 1px solid #2d3b59;
            margin-bottom: 18px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
            flex-wrap: wrap;
        }

        .hud-item span { color: var(--accent-amber); font-size: 1.1rem; }
        .timer-badge {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid var(--accent-cyan);
            padding: 3px 12px;
            border-radius: 20px;
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 1.05rem;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--text-muted);
            border: 2px solid #2d3b59;
            padding: 11px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { border-color: var(--accent-cyan); color: var(--text-main); }
        .tab-btn.active {
            background: rgba(6, 182, 212, 0.18);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.3);
        }

        .game-section {
            display: none;
            background: var(--panel-bg);
            border: 1px solid #2d3b59;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 820px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.55);
        }

        .game-section.active { display: block; }

        .section-desc {
            color: var(--text-muted);
            margin-bottom: 18px;
            text-align: center;
            font-size: 0.95rem;
        }

        /* GRAPHIC 1: ROTATING ALGEBRAIC WHEEL */
        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .wheel-stage {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -12px;
            z-index: 20;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 24px solid var(--accent-amber);
            filter: drop-shadow(0 0 8px var(--accent-amber));
        }

        .outer-ring {
            width: 290px;
            height: 290px;
            border-radius: 50%;
            border: 4px dashed var(--accent-cyan);
            background: radial-gradient(circle, #1e293b 0%, #090d16 100%);
            position: relative;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25), inset 0 0 25px rgba(6, 182, 212, 0.2);
        }

        .wheel-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 112px;
            text-align: center;
            font-size: 0.78rem;
            font-weight: bold;
            color: var(--text-main);
            background: rgba(15, 23, 42, 0.92);
            padding: 4px 5px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .inner-hub {
            position: absolute;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #070b14);
            border: 4px solid var(--accent-amber);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .inner-hub small { color: var(--accent-amber); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
        .inner-hub div { font-size: 1.1rem; font-weight: bold; margin-top: 4px; color: #fff; }

        .wheel-controls {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        /* GRAPHIC 2: SLIDING PANELS */
        .slider-visual-box {
            background: #090d16;
            border: 1px solid #2d3b59;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .sliding-panel {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #475569;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s, border-color 0.3s;
        }

        .sliding-panel.active-slide {
            transform: translateX(22px);
            background: rgba(16, 185, 129, 0.22);
            border-left-color: var(--accent-emerald);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .panel-law-name { font-weight: bold; color: var(--accent-amber); font-size: 0.95rem; }
        .panel-formula { font-family: monospace; font-size: 1.05rem; color: #e2e8f0; }

        /* GRAPHIC 3: PRIME CIRCUIT BOARD */
        .circuit-board {
            background: #060911;
            border: 2px solid #2d3b59;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .circuit-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
        }

        .node {
            aspect-ratio: 1;
            border-radius: 50%;
            background: #162038;
            border: 2px solid #334155;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .node.is-prime {
            border-color: rgba(6, 182, 212, 0.45);
            color: #cbd5e1;
        }

        .node.lit-node {
            background: rgba(16, 185, 129, 0.3);
            border-color: var(--accent-emerald);
            color: #6ee7b7;
            box-shadow: 0 0 16px var(--accent-emerald);
            transform: scale(1.15);
        }

        /* QUESTION & 4 OPTIONS AREA */
        .question-card {
            background: #0b1120;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .q-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
            border: 1px solid var(--accent-purple);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.45;
            color: #fff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .option-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 2px solid #334155;
            padding: 14px 16px;
            border-radius: 12px;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-cyan);
